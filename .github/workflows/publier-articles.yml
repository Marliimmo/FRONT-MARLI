name: Publication des articles

on:
  schedule:
    - cron: '7 * * * *'   # toutes les heures : articles du dashboard et brouillons datés
  workflow_dispatch:       # bouton "Run workflow" pour publier tout de suite
  push:
    branches: [main]
    paths: ['content/articles/**', 'public/articles/**']   # brouillon Markdown ou page HTML déposée

permissions:
  contents: write

concurrency:
  group: publier-articles
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances du script
        run: npm install --no-audit --no-fund
        working-directory: scripts

      - name: Publier les articles dont la date est atteinte
        run: node scripts/publish-articles.mjs

      - name: Commit et push (déclenche le déploiement Vercel)
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "Rien à publier."; exit 0; fi
          # Même auteur que les commits manuels, pour que Vercel accepte le déploiement
          git config user.name "Marliimmo"
          git config user.email "marli.immobilier@gmail.com"
          git add -A public/articles public/biens public/sitemap.xml public/rss.xml content
          git commit -m "Mise à jour automatique des articles et des biens $(date +%F)"
          git push
